<!doctype html>
<html><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>

.mono{font-family:'IBM Plex Mono',monospace}

svg text{font-family:'IBM Plex Sans',Arial,sans-serif}
#progress{position:absolute;left:0;top:1074px;height:6px;background:#6250d6;z-index:10}
</style></head>
<body>
<div id="root"></div>
<div id="progress"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
function el(p, tag, at, txt) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt !== undefined) e.textContent = txt; p.appendChild(e); return e; }
function h(p, tag, cls, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; p.appendChild(e); return e; }
const C = { ink: '#14213d', muted: '#4a5568', faint: '#9aa1b2', line: '#d9dce3', pur: '#6250d6', lav: '#eceaf9', lav2: '#b7acff', cake: '#2a78d6', rules: '#eb6834', red: '#d64545',
  voice: '#1d3557', video: '#457b9d', be: '#a8c5da', bulk: '#dde8f0', bg2: '#eef1f7' };
const LANES = [['Voice', C.voice, '#fff'], ['Video', C.video, '#fff'], ['Best Effort', C.be, C.ink], ['Bulk', C.bulk, C.ink]];
function fmt(v, dec) { return v.toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* fade/slide helper for any element (HTML or SVG) */
function appear(e, t, at, opts = {}) {
  const d = opts.d || 0.7, dy = opts.dy === undefined ? 20 : opts.dy, dx = opts.dx || 0;
  const p = eo(prog(t, at, at + d)); const q = opts.out != null ? 1 - prog(t, opts.out, opts.out + 0.5) : 1;
  e.style.opacity = p * q; e.style.transform = `translate(${(1 - p) * dx}px,${(1 - p) * dy}px)`; return p * q;
}
/* packets along a polyline */
function mkPath(pts) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, len: L[L.length - 1] }; }
function at(P, d) { let i = 1; while (i < P.L.length - 1 && P.L[i] < d) i++; const s = (d - P.L[i - 1]) / ((P.L[i] - P.L[i - 1]) || 1); const a = P.pts[i - 1], b = P.pts[i]; return [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s]; }
class Stream {
  constructor(g, pts, o) { Object.assign(this, { n: 24, period: 0.2, speed: 260, r: 6, fill: C.pur, stroke: null, t0: 0, t1: 1e9 }, o); this.P = mkPath(pts); this.c = [];
    for (let i = 0; i < this.n; i++) { const c = el(g, 'circle', { r: this.r, fill: this.fill, opacity: 0 }); if (this.stroke) { c.setAttribute('stroke', this.stroke); c.setAttribute('stroke-width', 2.5); } this.c.push(c); } }
  update(t) { const ph = t - this.t0, cyc = this.n * this.period;
    for (let i = 0; i < this.n; i++) { const c = this.c[i]; if (ph < i * this.period) { c.setAttribute('opacity', 0); continue; }
      const a = (ph - i * this.period) % cyc, d = a * this.speed, spawn = t - a; if (d > this.P.len || spawn > this.t1) { c.setAttribute('opacity', 0); continue; }
      const [x, y] = at(this.P, d); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('opacity', 1); } }
}

/* ===== scene scaffolding ===== */
const SCENES = {};
let TOTAL = 12;
function scene(id, o) { SCENES[id] = o; }
function frame(id, o) {
  const root = document.getElementById('root');
  const s = h(root, 'div', 'scene' + (o.dark ? ' dark' : ''));
  if (o.kick) h(s, 'div', 'kick', o.kick);
  if (o.title) h(s, 'div', 'title', o.title);
  if (o.chap) h(s, 'div', 'chap', o.chap);
  const buls = [];
  if (o.buls) { const box = h(s, 'div', 'buls'); o.buls.forEach((b, i) => { const r = h(box, 'div', 'bul', `<div class="n">${i + 1}</div><div>${b}</div>`); buls.push(r); }); }
  let svg = null;
  if (o.panel !== false) { svg = el(s, 'svg', { class: 'panel', width: o.pw || 1024, height: o.ph || 690, viewBox: `0 0 ${o.pw || 1024} ${o.ph || 690}` }); svg.style.overflow = 'visible'; }
  return { s, buls, svg };
}
function bullets(F, t, c) {
  F.buls.forEach((b, i) => { const on = t >= c[i] - 0.2 && (i === c.length - 1 || t < c[i + 1] - 0.2);
    b.className = 'bul' + (on ? ' on' : (t >= c[i] - 0.2 ? ' past' : '')); appear(b, t, c[i] - 0.4, { dy: 14, d: 0.5 }); });
}
/* a group that shows from cue k until cue k+1 (or stays with keep) */
function stage(g, t, c, k, keep) { const a = c[k] - 0.3, b = keep || k === c.length - 1 ? null : c[k + 1] - 0.5; return appear(g, t, a, { out: b, dy: 16 }); }

/* =================================================================
   TITLE
   ================================================================= */
scene('title', { build() {
  const F = frame('title', { dark: true, panel: false }); this.F = F;
  this.big = h(F.s, 'div', 'a num', 'How AQoSE works,<br><span style="color:#b7acff">in detail</span>', 'left:96px;top:250px;font-size:120px;line-height:1.02;letter-spacing:-3px');
  this.k = h(F.s, 'div', 'kick', 'PART 2');
  const ch = ['What CAKE already does', 'The architecture', 'What it reads', 'The model', 'The decision', 'Re-checking', 'The safety net', 'The line speed', 'How we tested', 'Results', 'Limits and next steps'];
  this.items = ch.map((x, i) => h(F.s, 'div', 'a', `<span class="num" style="color:#b7acff;font-size:26px;display:inline-block;width:52px">${String(i + 1).padStart(2, '0')}</span>${x}`, `left:1180px;top:${250 + i * 58}px;font-size:28px;color:#f4f3ef`));
}, update(t, c) { appear(this.k, t, 0.1); appear(this.big, t, 0.3, { dy: 40 }); this.items.forEach((e, i) => appear(e, t, 0.9 + i * 0.12, { dx: 30, dy: 0 })); } });

/* =================================================================
   1 · CAKE
   ================================================================= */
scene('cake', { build() {
  const F = frame('cake', { kick: '01 · WHAT CAKE ALREADY DOES', title: 'A strong queue manager, with one blind spot', chap: '1 / 11',
    buls: ['Shapes just below the line rate, so the queue sits in the router', 'Fair between devices, then between each device\'s connections', 'Four priority tins: Voice, Video, Best Effort, Bulk', 'Uses the tins only for marked packets'] });
  this.F = F; const g = F.svg;
  /* v0 shaping */
  const v0 = this.v0 = el(g, 'g', {});
  const box = (x, label, sub) => { el(v0, 'rect', { x, y: 220, width: 220, height: 150, rx: 16, fill: C.ink }); el(v0, 'text', { x: x + 110, y: 262, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 700, fill: '#fff' }, label); if (sub) el(v0, 'text', { x: x + 110, y: 290, 'text-anchor': 'middle', 'font-size': 17, fill: '#d6dbe8' }, sub); };
  box(20, 'Router', 'CAKE'); box(400, 'Modem', 'oversized buffer');
  el(v0, 'path', { d: 'M860 380 a50 50 0 0 1 6 -98 a68 68 0 0 1 124 -22 a54 54 0 0 1 30 120 Z', fill: C.bg2, stroke: C.ink, 'stroke-width': 3 });
  el(v0, 'text', { x: 930, y: 346, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.ink }, 'Internet');
  el(v0, 'line', { x1: 240, y1: 295, x2: 400, y2: 295, stroke: C.ink, 'stroke-width': 6 }); el(v0, 'line', { x1: 620, y1: 295, x2: 850, y2: 295, stroke: C.ink, 'stroke-width': 3 });
  el(v0, 'text', { x: 735, y: 280, 'text-anchor': 'middle', 'font-size': 18, fill: C.muted }, 'the line');
  this.mq = []; this.rq = [];
  for (let i = 0; i < 9; i++) this.mq.push(el(v0, 'rect', { x: 432 + i * 18, y: 316, width: 14, height: 36, rx: 3, fill: C.rules, opacity: 0 }));
  for (let i = 0; i < 3; i++) this.rq.push(el(v0, 'rect', { x: 60 + i * 18, y: 316, width: 14, height: 36, rx: 3, fill: C.pur, opacity: 0 }));
  this.mLab = el(v0, 'text', { x: 510, y: 430, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.rules, opacity: 0 }, 'queue builds here: up to 500 ms');
  this.rLab = el(v0, 'text', { x: 130, y: 430, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.pur, opacity: 0 }, 'shaped to 95%: queue here');
  this.sh = el(v0, 'rect', { x: 240, y: 286, width: 40, height: 18, fill: C.pur, opacity: 0 });
  /* v1 fairness */
  const v1 = this.v1 = el(g, 'g', {});
  el(v1, 'rect', { x: 40, y: 120, width: 940, height: 60, rx: 8, fill: C.ink }); el(v1, 'text', { x: 510, y: 158, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#fff' }, 'the line');
  this.dv = [el(v1, 'rect', { x: 40, y: 250, width: 0, height: 60, rx: 8, fill: C.video }), el(v1, 'rect', { x: 516, y: 250, width: 0, height: 60, rx: 8, fill: C.be })];
  this.dvt = [el(v1, 'text', { x: 278, y: 288, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: '#fff' }, 'laptop: half'), el(v1, 'text', { x: 754, y: 288, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.ink }, 'TV: half')];
  this.cn = []; for (let i = 0; i < 4; i++) this.cn.push(el(v1, 'rect', { x: 40 + i * 119, y: 380, width: 111, height: 60, rx: 8, fill: i === 0 ? C.pur : '#9aa1b2', opacity: 0 }));
  this.cnt = el(v1, 'text', { x: 40, y: 480, 'font-size': 22, fill: C.ink, opacity: 0 }, 'each connection on the laptop: an equal slice');
  this.cnt2 = el(v1, 'text', { x: 40, y: 512, 'font-size': 22, fill: C.pur, 'font-weight': 700, opacity: 0 }, 'the call (purple) gets no more than a download');
  /* v2 tins */
  const v2 = this.v2 = el(g, 'g', {}); this.tb = [];
  const share = [[25, 'up to 25% at priority'], [50, 'up to 50% at priority'], [100, 'up to 100%'], [6.25, 'at least 6.25%, never starved']];
  share.forEach(([p, lab], i) => { const y = 90 + i * 130; el(v2, 'text', { x: 0, y: y + 10, 'font-size': 26, 'font-weight': 700, fill: C.ink }, LANES[i][0]);
    el(v2, 'rect', { x: 0, y: y + 26, width: 1000, height: 54, rx: 8, fill: '#f1f2f6' });
    this.tb.push([el(v2, 'rect', { x: 0, y: y + 26, width: 0, height: 54, rx: 8, fill: LANES[i][1] }), p]);
    el(v2, 'text', { x: 1000, y: y + 10, 'text-anchor': 'end', 'font-size': 22, fill: C.muted }, lab); });
  /* v3 marks */
  const v3 = this.v3 = el(g, 'g', {});
  LANES.forEach(([n, f, tc], i) => { el(v3, 'rect', { x: 520, y: 120 + i * 100, width: 480, height: 70, rx: 10, fill: f }); el(v3, 'text', { x: 540, y: 163 + i * 100, 'font-size': 22, 'font-weight': 700, fill: tc }, n); });
  el(v3, 'rect', { x: 0, y: 230, width: 200, height: 120, rx: 14, fill: C.ink }); el(v3, 'text', { x: 100, y: 298, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 700, fill: '#fff' }, 'CAKE');
  this.s3a = new Stream(v3, [[-200, 250], [200, 260], [520, 155], [1000, 155]], { n: 10, period: 0.9, speed: 300, r: 11, fill: C.pur, stroke: '#fff' });
  this.s3b = new Stream(v3, [[-200, 330], [200, 320], [520, 355], [1000, 355]], { n: 40, period: 0.16, speed: 300, r: 8, fill: '#8a90a2' });
  el(v3, 'text', { x: 0, y: 420, 'font-size': 22, fill: C.pur, 'font-weight': 700 }, '● marked "voice": Voice tin');
  el(v3, 'text', { x: 0, y: 456, 'font-size': 22, fill: C.muted, 'font-weight': 700 }, '● no mark: Best Effort');
  el(v3, 'text', { x: 0, y: 560, 'font-size': 24, fill: C.ink }, 'Most apps never set the mark, and providers often strip it.');
}, update(t, c) {
  const F = this.F; bullets(F, t, c);
  stage(this.v0, t, c, 0);
  const bloat = prog(t, c[0] + 0.5, c[0] + 3), fix = prog(t, c[0] + 4.5, c[0] + 6);
  this.mq.forEach((r, i) => r.setAttribute('opacity', (bloat * 9 > i ? 1 : 0) * (1 - fix)));
  this.rq.forEach((r, i) => r.setAttribute('opacity', fix * 3 > i ? 1 : 0));
  this.mLab.setAttribute('opacity', bloat * (1 - fix)); this.rLab.setAttribute('opacity', fix); this.sh.setAttribute('opacity', fix);
  stage(this.v1, t, c, 1);
  const p1 = eo(prog(t, c[1] + 0.4, c[1] + 1.4)); this.dv[0].setAttribute('width', 470 * p1); this.dv[1].setAttribute('width', 464 * p1); this.dvt.forEach(x => x.setAttribute('opacity', p1));
  this.cn.forEach((r, i) => r.setAttribute('opacity', prog(t, c[1] + 1.8 + i * 0.2, c[1] + 2.1 + i * 0.2)));
  this.cnt.setAttribute('opacity', prog(t, c[1] + 2.6, c[1] + 3)); this.cnt2.setAttribute('opacity', prog(t, c[1] + 3.2, c[1] + 3.6));
  stage(this.v2, t, c, 2);
  this.tb.forEach(([r, p], i) => r.setAttribute('width', 10 * p * eo(prog(t, c[2] + 2 + i * 0.9, c[2] + 3 + i * 0.9))));
  stage(this.v3, t, c, 3); if (t > c[3] - 1) { this.s3a.update(t); this.s3b.update(t); }
} });

/* =================================================================
   2 · ARCHITECTURE
   ================================================================= */
scene('arch', { build() {
  const F = frame('arch', { kick: '02 · THE ARCHITECTURE', title: 'One label per connection, and nothing on the packet path', chap: '2 / 11',
    buls: ['AQoSE adds one thing: a label on each connection', 'Kernel: the conntrack mark picks the CAKE tin; 0 = plain CAKE', 'Upload copies the mark to packets; download restores it on an IFB', 'Controller (Go): extract, classify, check, write the mark', 'Classifier service (Go) and a separate watchdog', 'Remove two rules and it is off'] });
  this.F = F; const g = F.svg;
  this.parts = [];
  const P = (k, fn) => { const gg = el(g, 'g', {}); fn(gg); this.parts.push([gg, k]); return gg; };
  P(0, gg => { el(gg, 'rect', { x: 0, y: 380, width: 1024, height: 300, rx: 18, fill: C.bg2 }); el(gg, 'text', { x: 20, y: 414, 'font-size': 22, 'font-weight': 700, fill: C.ink }, 'Linux kernel: every packet'); el(gg, 'rect', { x: 0, y: 0, width: 1024, height: 330, rx: 18, fill: 'none', stroke: C.pur, 'stroke-width': 2, 'stroke-dasharray': '8 6' }); el(gg, 'text', { x: 20, y: 34, 'font-size': 22, 'font-weight': 700, fill: C.pur }, 'aqosd · the controller (Go)'); });
  P(1, gg => {
    el(gg, 'rect', { x: 20, y: 470, width: 100, height: 70, rx: 35, fill: '#fff', stroke: C.ink, 'stroke-width': 2.5 }); el(gg, 'text', { x: 70, y: 512, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.ink }, 'LAN');
    el(gg, 'rect', { x: 170, y: 450, width: 220, height: 110, rx: 12, fill: '#fff', stroke: C.ink, 'stroke-width': 2.5 }); el(gg, 'text', { x: 280, y: 490, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.ink }, 'conntrack');
    el(gg, 'text', { x: 280, y: 520, 'text-anchor': 'middle', 'font-size': 18, fill: C.muted }, 'mark: low 3 bits'); el(gg, 'text', { x: 280, y: 544, 'text-anchor': 'middle', 'font-size': 16, fill: C.muted }, '1 Bulk 2 BE 3 Video 4 Voice');
    LANES.forEach(([n, f, tc], i) => { el(gg, 'rect', { x: 450 + i * 105, y: 450, width: 100, height: 110, fill: f }); el(gg, 'text', { x: 500 + i * 105, y: 484, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: tc }, n); });
    el(gg, 'text', { x: 660, y: 590, 'text-anchor': 'middle', 'font-size': 18, fill: C.muted }, 'CAKE diffserv4 · fwmark 0x7 picks the tin');
    el(gg, 'rect', { x: 900, y: 470, width: 100, height: 70, rx: 35, fill: '#fff', stroke: C.ink, 'stroke-width': 2.5 }); el(gg, 'text', { x: 950, y: 512, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.ink }, 'WAN');
    [[120, 505, 170, 505], [390, 505, 450, 505], [870, 505, 900, 505]].forEach(([a, b, x, y]) => el(gg, 'line', { x1: a, y1: b, x2: x, y2: y, stroke: C.ink, 'stroke-width': 3 }));
    el(gg, 'text', { x: 280, y: 640, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: C.pur }, 'mark 0 = plain CAKE');
  });
  P(2, gg => {
    el(gg, 'rect', { x: 430, y: 610, width: 270, height: 50, rx: 10, fill: '#fff', stroke: C.pur, 'stroke-width': 2 }); el(gg, 'text', { x: 565, y: 642, 'text-anchor': 'middle', 'font-size': 17, fill: C.ink }, 'upload: copy mark → packet');
    el(gg, 'rect', { x: 715, y: 610, width: 300, height: 50, rx: 10, fill: '#fff', stroke: C.pur, 'stroke-width': 2 }); el(gg, 'text', { x: 865, y: 642, 'text-anchor': 'middle', 'font-size': 17, fill: C.ink }, 'download: IFB restores mark');
  });
  P(3, gg => {
    const B = (x, y, w, t1, t2) => { el(gg, 'rect', { x, y, width: w, height: 90, rx: 12, fill: C.lav, stroke: C.pur, 'stroke-width': 2 }); el(gg, 'text', { x: x + w / 2, y: y + 40, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 700, fill: C.ink }, t1); el(gg, 'text', { x: x + w / 2, y: y + 66, 'text-anchor': 'middle', 'font-size': 17, fill: C.muted }, t2); };
    B(20, 70, 220, 'Extractor', 'first 8 packets'); B(280, 70, 180, 'Reclassifier', '1 check / s'); B(500, 70, 200, 'Safety shield', 'accept · clamp · reject'); B(740, 70, 250, 'Enforcer', 'write mark, read back');
    B(280, 200, 180, 'Estimator', 'line speed'); B(500, 200, 200, 'Verifier', 'delay after a change');
    el(gg, 'path', { d: 'M258 450 V115 H246', stroke: C.pur, 'stroke-width': 3, 'marker-end': 'url(#ar)', fill: 'none' });
    el(gg, 'path', { d: 'M1012 115 V450', stroke: C.pur, 'stroke-width': 3, 'marker-end': 'url(#ar)', fill: 'none' });
    el(gg, 'text', { x: 266, y: 340, 'font-size': 17, fill: C.pur, 'font-weight': 700 }, 'headers');
    el(gg, 'text', { x: 1004, y: 340, 'text-anchor': 'end', 'font-size': 17, fill: C.pur, 'font-weight': 700 }, 'set mark');
  });
  P(4, gg => {
    el(gg, 'rect', { x: 740, y: 200, width: 250, height: 90, rx: 12, fill: '#fff', stroke: C.pur, 'stroke-width': 3 }); el(gg, 'text', { x: 865, y: 240, 'text-anchor': 'middle', 'font-size': 21, 'font-weight': 700, fill: C.ink }, 'aqos-classify'); el(gg, 'text', { x: 865, y: 266, 'text-anchor': 'middle', 'font-size': 17, fill: C.muted }, '259 trees · 6 µs');

/* ===== timeline ===== */
let T = null;
window.setTiming = function (tj) {
  T = tj; for (const s of T.scenes) { const S = SCENES[s.id]; S.build(); S.el = S.F.s; }
};
window.render = function (tau) {
  for (const s of T.scenes) {
    const S = SCENES[s.id], local = tau - s.start;
    const o = Math.min(clamp(local / 0.45 + (s.start === 0 ? 1 : 0)), clamp((s.dur - local) / 0.45));
    S.el.style.display = o > 0 ? 'block' : 'none'; S.el.style.opacity = o;
    if (o > 0) S.update(local, s.cues, s.dur);
  }
  document.getElementById('progress').style.width = (1920 * tau / T.duration) + 'px';
};
