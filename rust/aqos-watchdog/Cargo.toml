[package]
name = "aqos-watchdog-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["net", "process"] }
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
