[package]
name = "aqos-classify-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
getrandom = "0.3"
rustix = { version = "1", features = ["time"] }
signal-hook = "0.3"

[dev-dependencies]
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
